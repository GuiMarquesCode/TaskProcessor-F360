services:
  mongodb:
    image: mongo:7.0
    container_name: f360-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: f360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: src/F360.TaskProcessor.Api/Dockerfile
    container_name: f360-task-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: F360TaskProcessorDb
      MongoDb__TasksCollectionName: tasks
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__QueueName: f360.tasks.queue
    depends_on:
      - mongodb
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: src/F360.TaskProcessor.Worker/Dockerfile
    container_name: f360-task-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: F360TaskProcessorDb
      MongoDb__TasksCollectionName: tasks
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__QueueName: f360.tasks.queue
    depends_on:
      - mongodb
      - rabbitmq

volumes:
  mongodb_data:
